name: Tests

on: [push, pull_request]

permissions:
  contents: read

# Pushing a new commit to a branch supersedes the older in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -q -p no:warnings

  sqlite-before-returning:
    # Debian bullseye's SQLite is 3.34.1, older than RETURNING (3.35); many distro
    # Pythons are older still. PostgreSQL and MySQL skip here, having no Docker.
    runs-on: ubuntu-latest
    container: python:3.10-slim-bullseye
    # .python-version asks for 3.12, which uv would download along with a current SQLite;
    # pin the container's own Python so the tests run on its old SQLite.
    env:
      UV_PYTHON: /usr/local/bin/python3.10
      UV_PYTHON_DOWNLOADS: never

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Install the project
        run: uv sync --frozen --all-extras --dev

      - name: Run tests
        run: |
          uv run python -c "import sqlite3, sys; print('SQLite', sqlite3.sqlite_version); sys.exit(sqlite3.sqlite_version_info >= (3, 35))"
          uv run pytest -q -p no:warnings
